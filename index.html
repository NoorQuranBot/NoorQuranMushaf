<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>نور القرآن | المصحف</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"><link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f2e7;--ink:#201d19;--card:#fffaf0;--border:#cbb88f;--accent:#8e3d30;--font:clamp(20px,4.5vw,34px)}
body.dark{--bg:#101318;--ink:#f5f1e9;--card:#1d222a;--border:#5b5d61;--accent:#efb88c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Amiri,serif}header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:6px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--ink);min-height:43px;padding:4px 12px}button:focus-visible,select:focus-visible{outline:3px solid var(--accent)}h1{font-size:20px;margin:0}#paper{background:var(--card);border:2px solid var(--border);border-radius:15px;min-height:65vh;max-width:790px;margin:16px auto;padding:22px 12px 34px;touch-action:pan-y;box-shadow:0 4px 25px #0000000c}#heading{text-align:center;font-size:25px;margin:0 0 15px}#lines{display:flex;flex-direction:column;justify-content:space-evenly;min-height:53vh;gap:8px} .line{font-family:'Amiri Quran',Amiri,serif;font-size:var(--font);text-align:center;line-height:1.95;direction:rtl;white-space:normal}.surah{font-size:calc(var(--font)*.9);color:var(--accent);border:1px solid var(--border);border-radius:9px;padding:2px;text-align:center}.verse-number{color:var(--accent);font-size:.76em;margin:0 3px}#status{text-align:center;min-height:24px;color:var(--accent)}#footer{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px auto 25px;padding:0 8px}#pageInput{width:72px;text-align:center;border:1px solid var(--border);background:var(--card);color:var(--ink);border-radius:8px;height:43px}#surahs{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;overflow:auto;padding:15px;max-width:100vw}#surahs.open{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:800px;margin:auto}.grid button{padding:8px 3px;min-height:50px;font-size:16px}#filter{display:block;width:min(100%,800px);margin:12px auto;padding:12px;background:var(--card);color:var(--ink);border:1px solid var(--border);border-radius:9px}.muted{font-size:14px;text-align:center;opacity:.8;margin:10px}.tools{display:flex;gap:5px;align-items:center}#credit{font-size:12px;text-align:center;padding:10px;opacity:.75}#credit a{color:var(--accent)}@media(max-width:420px){header{padding:6px}header button{padding:3px 8px}h1{font-size:16px}#paper{margin:9px 7px;padding:14px 7px} .line{line-height:1.8}}
</style>
</head>
<body>
<header><button id="listBtn" aria-label="فهرس السور">☰ السور</button><h1>📖 نور القرآن</h1><div class="tools"><button id="minus" aria-label="تصغير">−</button><button id="plus" aria-label="تكبير">+</button><button id="theme" aria-label="الوضع الليلي">🌙</button></div></header>
<main><section id="paper" aria-label="صفحة المصحف، اسحب للتقليب"><h2 id="heading">سورة الفاتحة</h2><div id="status">جار تحميل الصفحة…</div><div id="lines"></div></section>
<nav id="footer"><button id="prev">→ السابقة</button><label>صفحة <input id="pageInput" type="number" min="1" max="604" value="1" inputmode="numeric" aria-label="رقم الصفحة"> من 604</label><button id="next">التالية ←</button></nav><p class="muted">اسحب الصفحة لليمين للصفحة السابقة، ولليسار للصفحة التالية. يمكنك تكبير الصفحة بإصبعيك أيضًا.</p></main>
<aside id="surahs" aria-label="فهرس السور"><button id="close">✕ إغلاق الفهرس</button><h2 style="text-align:center">فهرس السور (114)</h2><input id="filter" placeholder="🔎 ابحث عن اسم السورة" aria-label="البحث عن سورة"><div class="grid" id="grid"></div></aside>
<footer id="credit">البيانات القرآنية وتوزيع الأسطر: <a href="https://github.com/ouryhamdalaye/madinah-mushaf-json" target="_blank" rel="noopener">Madinah Mushaf JSON</a> (CC BY-SA 4.0). واجهة قراءة تجريبية؛ الخط ليس صورة طبق الأصل من المصحف المطبوع.</footer>
<script>
'use strict';
const base='https://cdn.jsdelivr.net/gh/ouryhamdalaye/madinah-mushaf-json@main/pages/';
const $=id=>document.getElementById(id);let page=Math.min(604,Math.max(1,Number(localStorage.getItem('noor-page'))||1)),size=Number(localStorage.getItem('noor-size'))||28,meta=[],request=0;
function setFont(){size=Math.max(18,Math.min(48,size));document.documentElement.style.setProperty('--font',`clamp(${Math.max(17,size-6)}px,5vw,${size}px)`);localStorage.setItem('noor-size',size)}
setFont();if(localStorage.getItem('noor-dark')==='1')document.body.classList.add('dark');
$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('noor-dark',document.body.classList.contains('dark')?'1':'0')};$('plus').onclick=()=>{size+=3;setFont()};$('minus').onclick=()=>{size-=3;setFont()};
async function getJSON(path){const r=await fetch(base+path);if(!r.ok)throw Error('تعذر الاتصال بمصدر المصحف ('+r.status+')');return r.json()}
function digits(n){return String(n).padStart(3,'0')}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
async function loadPage(n){n=Math.max(1,Math.min(604,Math.trunc(Number(n)||1)));page=n;const id=++request;$('pageInput').value=n;$('status').textContent='جار تحميل الصفحة…';$('lines').replaceChildren();$('heading').textContent='صفحة '+n;
try{const d=await getJSON('page-'+digits(n)+'.json');if(id!==request)return;
const lookup=new Map();for(const v of d.verses||[])for(const w of v.words||[])lookup.set(`${v.surah_number}:${v.ayah_number}:${w.word_index}`,w.text);
const fragment=document.createDocumentFragment();let previous=null;
for(const line of d.lines||[]){if(line.type==='surah-header'){fragment.append(el('div','surah',line.text||'سورة'));continue}if(line.type!=='ayah-line')continue;
const row=el('div','line');for(const token of line.tokens||[]){const key=`${token.s}:${token.a}:${token.w}`,word=lookup.get(key);if(word===undefined)continue;
if(row.childNodes.length)row.append(document.createTextNode(' '));row.append(document.createTextNode(word));
// Add an ayah marker only when this token is the final word of that ayah on this page.
const v=(d.verses||[]).find(v=>v.surah_number===token.s&&v.ayah_number===token.a);
if(v&&v.words?.length&&token.w===v.words[v.words.length-1].word_index){const marker=el('span','verse-number',' ۞'+toArabic(token.a)+' ');row.append(marker)}previous=token}
fragment.append(row)}$('lines').replaceChildren(fragment);$('status').textContent='';localStorage.setItem('noor-page',n);const found=meta.filter(s=>Number(s.start_page)<=n).at(-1);if(found)$('heading').textContent='سورة '+found.name+' — الصفحة '+n;
}catch(e){if(id!==request)return;$('status').textContent='تعذر تحميل الصفحة. تحقق من الإنترنت ثم اضغط إعادة المحاولة.';const retry=el('button','', 'إعادة المحاولة');retry.onclick=()=>loadPage(page);$('lines').replaceChildren(retry);console.error(e)}}
function toArabic(n){return String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[Number(d)])}
$('next').onclick=()=>loadPage(page+1);$('prev').onclick=()=>loadPage(page-1);$('pageInput').onchange=e=>loadPage(e.target.value);
$('listBtn').onclick=()=>{$('surahs').classList.add('open');$('filter').focus()};$('close').onclick=()=>$('surahs').classList.remove('open');
function drawList(q=''){const grid=$('grid');grid.replaceChildren();const normalized=s=>String(s||'').normalize('NFKD').replace(/[\u064b-\u065f]/g,'').replace(/[أإآ]/g,'ا');for(const s of meta){if(!normalized(s.name).includes(normalized(q)))continue;const b=el('button','',s.id+' '+s.name);b.onclick=()=>{$('surahs').classList.remove('open');loadPage(s.start_page)};grid.append(b)}}$('filter').oninput=e=>drawList(e.target.value);
let touchX=null,touchY=null;const paper=$('paper');paper.addEventListener('touchstart',e=>{if(e.touches.length!==1){touchX=null;return}touchX=e.touches[0].clientX;touchY=e.touches[0].clientY},{passive:true});paper.addEventListener('touchend',e=>{if(touchX===null||e.changedTouches.length!==1)return;const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;touchX=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3){loadPage(page+(dx>0?-1:1))}},{passive:true});
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')loadPage(page-1);if(e.key==='ArrowLeft')loadPage(page+1)});
(async()=>{try{meta=await getJSON('meta.json');drawList()}catch(e){$('grid').textContent='تعذر تحميل فهرس السور، حاول تحديث الصفحة.';console.error(e)}await loadPage(page)})();
</script>
</body></html>
